<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0e12">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png">
<title>Lights</title>
<style>
  :root { --bg:#0d0e12; --card:#16181f; --line:#262a35; --text:#eceef3; --dim:#8a8fa1; --amber:#f2b84b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.35 system-ui,sans-serif;
         padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 28px); }
  h1 { font-size:26px; margin:0 0 2px; }
  .status { color:var(--dim); font-size:14px; min-height:20px; }
  .status.ov { color:var(--amber); }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); margin:26px 2px 10px; font-weight:600; }
  button { font:inherit; color:var(--text); border:1px solid var(--line); background:var(--card); border-radius:14px; cursor:pointer; }
  button:active { transform:scale(.97); }
  .modes { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
  .mode { padding:18px 12px; font-size:16px; font-weight:600; }
  .mode.active { background:#eceef3; color:#111; border-color:#eceef3; }
  .resume { width:100%; margin-top:10px; padding:12px; color:var(--amber); border-color:#5f4518; background:#2a1f0c; }
  .room { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:12px; }
  .rhead { display:flex; align-items:center; gap:10px; }
  .rname { font-size:19px; font-weight:650; flex:1; }
  .rcount { color:var(--dim); font-size:13px; font-weight:400; margin-left:6px; }
  .toggle { position:relative; width:58px; height:34px; flex:none; }
  .toggle input { opacity:0; width:0; height:0; position:absolute; }
  .toggle span { position:absolute; inset:0; background:#333744; border-radius:34px; transition:.2s; }
  .toggle span::after { content:""; position:absolute; left:4px; top:4px; width:26px; height:26px; background:#fff; border-radius:50%; transition:.2s; }
  .toggle input:checked + span { background:#e8a54b; }
  .toggle input:checked + span::after { transform:translateX(24px); }
  .toggle.small { width:48px; height:28px; }
  .toggle.small span::after { width:20px; height:20px; }
  .toggle.small input:checked + span::after { transform:translateX(20px); }
  input[type=range] { width:100%; margin:16px 0 4px; accent-color:#e8a54b; height:28px; }
  .sw { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
  .sw button { width:38px; height:38px; border-radius:50%; border:2px solid #0006; padding:0; }
  .lights { margin-top:12px; border-top:1px solid var(--line); padding-top:4px; }
  .light { display:flex; align-items:center; gap:12px; padding:10px 2px; }
  .dot { width:12px; height:12px; border-radius:50%; flex:none; background:#333; box-shadow:0 0 10px 1px var(--g, transparent); }
  .lname { flex:1; font-size:15px; }
  .lname small { display:block; color:var(--dim); font-size:12px; }
  .more { color:var(--dim); font-size:13px; background:none; border:none; padding:8px 2px 0; }
  .err { color:#ff7272; text-align:center; padding:30px 10px; }
</style>
</head>
<body>
<h1>Lights</h1>
<div class="status" id="status"></div>
<div class="modes" id="modes"></div>
<button class="resume" id="resume" hidden>Resume schedule</button>
<h2>Rooms</h2>
<div id="rooms"></div>

<script>
const FADE = 1.0;
const SWATCHES = [ {k:2700}, {k:4000}, {k:6500}, {hex:"#ff3b30"}, {hex:"#ff9f0a"}, {hex:"#30d158"}, {hex:"#0a84ff"}, {hex:"#bf5af2"} ];
let M = null, D = [], busyUntil = 0;
const open = new Set();
const $ = id => document.getElementById(id);
const post = (url, body) => fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body || {}) });
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]);
const hold = (ms = 2500) => { busyUntil = Date.now() + ms; };
function k2rgb(k) {
  k /= 100; let r, g, b;
  if (k <= 66) { r = 255; g = 99.47 * Math.log(k) - 161.12; b = k <= 19 ? 0 : 138.52 * Math.log(k - 10) - 305.04; }
  else { r = 329.7 * Math.pow(k - 60, -0.1332); g = 288.12 * Math.pow(k - 60, -0.0755); b = 255; }
  const c = v => Math.max(0, Math.min(255, Math.round(v)));
  return `rgb(${c(r)},${c(g)},${c(b)})`;
}
const glow = st => !st || !st.onOff ? "transparent" : st.colorTemInKelvin ? k2rgb(st.colorTemInKelvin) : st.color ? `rgb(${st.color.r},${st.color.g},${st.color.b})` : "#888";
const when = iso => {
  const d = new Date(iso), t = d.toLocaleTimeString([], { hour:"numeric", minute:"2-digit" });
  return d.toDateString() === new Date().toDateString() ? t : `${d.toLocaleDateString([], { weekday:"short" })} ${t}`;
};
const nameOf = id => (M.modes.find(m => m.id === id) || {}).name || id;

function renderModes() {
  const box = $("modes"); box.innerHTML = "";
  for (const m of M.modes) {
    const b = document.createElement("button");
    b.className = "mode" + (m.id === M.active ? " active" : "");
    b.textContent = m.name;
    b.onclick = () => { navigator.vibrate?.(10); post(`/api/modes/${encodeURIComponent(m.id)}/activate`).then(r => r.json()).then(s => { M = s; renderModes(); setTimeout(load, 1200); }); };
    box.appendChild(b);
  }
  const st = $("status");
  st.classList.toggle("ov", !!M.override);
  st.textContent = M.override ? `Override: ${nameOf(M.override.mode)}${M.override.until ? " until " + when(M.override.until) : ""}`
    : M.schedule.enabled ? `On schedule${M.next ? ` · ${nameOf(M.next.mode)} at ${when(M.next.at)}` : ""}` : "Schedule off";
  $("resume").hidden = !M.override;
}
$("resume").onclick = () => fetch("/api/mode/resume").then(r => r.json()).then(s => { M = s; renderModes(); setTimeout(load, 1200); });

function renderRooms() {
  const rooms = {};
  for (const d of D) (rooms[d.room || "Other"] ||= []).push(d);
  const names = Object.keys(rooms).sort((a, b) => (a === "Other") - (b === "Other") || a.localeCompare(b));
  const box = $("rooms");
  const scrollY = window.scrollY;
  box.innerHTML = "";
  for (const name of names) {
    const list = rooms[name], target = name === "Other" ? "room:" : "room:" + name;
    const url = `/api/devices/${encodeURIComponent(target)}`;
    const anyOn = list.some(d => d.status?.onOff);
    const avg = Math.round(list.filter(d => d.status?.onOff).reduce((a, d) => a + (d.status.brightness || 0), 0) / Math.max(1, list.filter(d => d.status?.onOff).length)) || 50;
    const el = document.createElement("div");
    el.className = "room";
    el.innerHTML = `
      <div class="rhead"><div class="rname">${esc(name)}<span class="rcount">${list.filter(d => d.status?.onOff).length}/${list.length} on</span></div>
        <label class="toggle"><input type="checkbox" class="rp"${anyOn ? " checked" : ""}><span></span></label></div>
      <input type="range" min="1" max="100" value="${avg}" class="rb">
      <div class="sw"></div>
      <button class="more">${open.has(name) ? "Hide lights" : `Show ${list.length} lights`}</button>
      <div class="lights"${open.has(name) ? "" : " hidden"}></div>`;
    el.querySelector(".rp").onchange = e => { hold(); navigator.vibrate?.(10); post(url, { action:"power", on:e.target.checked, fade:FADE }).then(() => setTimeout(load, 1500)); };
    let t;
    el.querySelector(".rb").oninput = e => { hold(); clearTimeout(t); t = setTimeout(() => post(url, { action:"brightness", value:+e.target.value }), 120); };
    const sw = el.querySelector(".sw");
    for (const s of SWATCHES) {
      const b = document.createElement("button");
      b.style.background = s.k ? k2rgb(s.k) : s.hex;
      b.title = s.k ? `${s.k}K white` : s.hex;
      b.onclick = () => {
        hold(); navigator.vibrate?.(10);
        const body = s.k ? { action:"kelvin", value:s.k, fade:FADE }
          : { action:"color", r:parseInt(s.hex.slice(1, 3), 16), g:parseInt(s.hex.slice(3, 5), 16), b:parseInt(s.hex.slice(5, 7), 16), fade:FADE };
        post(url, body).then(() => setTimeout(load, 1500));
      };
      sw.appendChild(b);
    }
    el.querySelector(".more").onclick = () => { open.has(name) ? open.delete(name) : open.add(name); renderRooms(); };
    const lights = el.querySelector(".lights");
    for (const d of list) {
      const row = document.createElement("div");
      row.className = "light";
      const fx = d.effect ? (d.effect === "screen" ? "screen sync" : d.effect) : d.scene ? d.scene : "";
      row.innerHTML = `<span class="dot" style="background:${glow(d.status)};--g:${glow(d.status)}"></span>
        <div class="lname">${esc(d.name)}<small>${d.online ? (d.status?.onOff ? `${d.status.brightness}%${fx ? " · " + esc(fx) : ""}` : "off") : "offline"}</small></div>
        <label class="toggle small"><input type="checkbox"${d.status?.onOff ? " checked" : ""}><span></span></label>`;
      row.querySelector("input").onchange = e => { hold(); post(`/api/devices/${encodeURIComponent(d.id)}`, { action:"power", on:e.target.checked, fade:0.8 }).then(() => setTimeout(load, 1500)); };
      lights.appendChild(row);
    }
    box.appendChild(el);
  }
  window.scrollTo(0, scrollY);
}

async function load() {
  try {
    const [m, d] = await Promise.all([fetch("/api/modes").then(r => r.json()), fetch("/api/devices").then(r => r.json())]);
    M = m; renderModes();
    if (Date.now() > busyUntil && !document.activeElement?.matches?.("input[type=range]")) { D = d; renderRooms(); }
  } catch {
    $("rooms").innerHTML = `<div class="err">Can't reach the lights server.</div>`;
  }
}
load();
setInterval(() => { if (!document.hidden) load(); }, 3000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
</script>
</body>
</html>
