<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png">
<title>Lights</title>
<style>
  :root {
    --bg:#0b0c10; --s1:#14161c; --s2:#1b1e26; --s3:#242833; --line:#23262f; --line2:#30343f;
    --text:#eef0f5; --dim:#8b90a0; --dim2:#5d6272; --amber:#f2b84b; --red:#ff6b6b; --ok:#5fe08a;
    --amb:transparent; --r:18px; --side:232px;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { color-scheme:dark; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 Inter,system-ui,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
  body::before { content:""; position:fixed; inset:-20% -10% auto -10%; height:70vh; pointer-events:none; z-index:0;
    background:radial-gradient(60% 60% at 30% 0%, var(--amb), transparent 70%); opacity:.16; transition:background 1.2s var(--ease); }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  input, select { font:inherit; color:var(--text); }
  [hidden] { display:none !important; }

  /* ---------- shell ---------- */
  .side { position:fixed; inset:0 auto 0 0; width:var(--side); padding:22px 14px; border-right:1px solid var(--line); background:#0d0e13e6;
    backdrop-filter:blur(12px); display:flex; flex-direction:column; gap:2px; z-index:5; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px; padding:4px 10px 20px; letter-spacing:.2px; }
  .brand i { width:22px; height:22px; border-radius:50%; background:conic-gradient(from 200deg,#ffb347,#ff5e62,#a46bff,#4fc3ff,#ffb347); box-shadow:0 0 16px #ff9a5a66; }
  .nav { text-decoration:none; display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:11px; color:var(--dim); font-weight:500; transition:background .15s,color .15s; }
  .nav:hover { background:var(--s1); color:var(--text); }
  .nav.on { background:var(--s2); color:var(--text); }
  .nav svg { width:19px; height:19px; flex:none; }
  .nav.sub { padding:7px 12px 7px 43px; font-size:14px; }
  .nav.sub b { margin-left:auto; font-weight:500; font-size:12px; color:var(--dim2); }
  .side .grow { flex:1; }
  .conn { display:flex; align-items:center; gap:8px; color:var(--dim2); font-size:12.5px; padding:8px 12px; }
  .conn i { width:7px; height:7px; border-radius:50%; background:var(--dim2); }
  .conn.live i { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .conn.down i { background:var(--red); }
  main { position:relative; z-index:1; margin-left:var(--side); padding:34px 40px 80px; max-width:1240px; }
  .tabs { display:none; }
  .view { animation:in .35s var(--ease); }
  @keyframes in { from { opacity:0; transform:translateY(6px); } }

  /* ---------- home ---------- */
  .hello { color:var(--dim); font-size:14px; }
  .hero { display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin:2px 0 22px; }
  .hero h1 { font-size:34px; line-height:1.15; margin:0; font-weight:700; letter-spacing:-.4px; }
  .hero .st { color:var(--dim); font-size:14px; padding-bottom:5px; }
  .hero .st.ov { color:var(--amber); }
  .chip { border:1px solid var(--line2); border-radius:30px; padding:6px 14px; font-size:13px; font-weight:600; background:var(--s1); transition:background .15s; }
  .chip:hover { background:var(--s2); }
  .chip.amber { color:var(--amber); border-color:#5f4518; background:#2a1f0c; }

  .modes { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; }
  .mode { position:relative; text-align:left; padding:16px 16px 14px; border-radius:var(--r); background:var(--s1); border:1px solid var(--line);
    overflow:hidden; transition:transform .15s var(--ease), border-color .3s, background .3s; min-height:92px; display:flex; flex-direction:column; justify-content:flex-end; }
  .mode:hover { background:var(--s2); }
  .mode:active { transform:scale(.97); }
  .mode .mg { position:absolute; inset:0 0 auto 0; height:4px; background:var(--mg); opacity:.75; transition:height .4s var(--ease), opacity .4s; }
  .mode b { position:relative; font-size:15.5px; font-weight:650; }
  .mode small { position:relative; color:var(--dim); font-size:12.5px; margin-top:2px; }
  .mode.on { border-color:transparent; }
  .mode.on .mg { height:100%; opacity:.28; }
  .mode.on::after { content:""; position:absolute; inset:0; border-radius:inherit; border:1.5px solid #ffffff38; pointer-events:none; }
  .mode.on small { color:#e6e8ee; }

  .day { margin:22px 0 6px; }
  .tl { position:relative; display:flex; height:30px; border-radius:10px; overflow:hidden; background:var(--s1); border:1px solid var(--line); }
  .tl span { height:100%; display:flex; align-items:center; padding:0 9px; font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#fff; text-shadow:0 1px 2px #0008;
    border-right:1px solid #0b0c10aa; }
  .tl .now { position:absolute; top:-3px; bottom:-3px; width:2px; background:#fff; box-shadow:0 0 8px #fff; border-radius:2px; }
  .ticks { display:flex; justify-content:space-between; color:var(--dim2); font-size:11px; margin-top:5px; padding:0 1px; }

  .room { margin-top:34px; }
  .rhead { display:flex; align-items:center; gap:14px; margin-bottom:14px; flex-wrap:wrap; }
  .rt { display:flex; align-items:baseline; gap:14px; min-width:0; }
  .rhead h2 { font-size:21px; margin:0; font-weight:700; letter-spacing:-.2px; }
  .rhead .rm { color:var(--dim); font-size:13.5px; }
  .rhead .sp { flex:1; }
  .rhead .slider { width:220px; height:36px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(225px,1fr)); gap:12px; }
  .tile { --c:#888; --cr:136,136,136; position:relative; display:flex; align-items:center; gap:12px; padding:14px 12px 14px 14px; border-radius:var(--r);
    background:var(--s1); border:1px solid var(--line); cursor:pointer; user-select:none; overflow:hidden; text-align:left;
    transition:transform .15s var(--ease), background .5s, border-color .5s; min-height:74px; }
  .tile:hover { border-color:var(--line2); }
  .tile:active { transform:scale(.975); }
  .tile.on { background:radial-gradient(120% 140% at 0% 0%, rgba(var(--cr),.22), transparent 60%), var(--s2); border-color:rgba(var(--cr),.28); }
  .tile.offline { opacity:.4; }
  .bulb { width:38px; height:38px; border-radius:50%; flex:none; background:var(--s3); display:grid; place-items:center; transition:background .5s, box-shadow .5s; }
  .bulb svg { width:19px; height:19px; color:var(--dim); }
  .tile.on .bulb { background:var(--c); box-shadow:0 0 22px rgba(var(--cr),.55); }
  .tile.on .bulb svg { color:#0008; }
  .tile.anim .bulb { background:var(--fx); background-size:200% 200%; animation:drift 6s linear infinite; }
  @keyframes drift { to { background-position:200% 0; } }
  .tt { min-width:0; flex:1; }
  .tt b { display:block; font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tt small { display:block; color:var(--dim); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile.bad .tt small { color:var(--red); }
  .more { width:32px; height:32px; border-radius:10px; display:grid; place-items:center; color:var(--dim); flex:none; transition:background .15s; }
  .more:hover { background:#ffffff12; color:var(--text); }
  .more svg { width:18px; height:18px; }
  .tile .bar { position:absolute; left:14px; right:14px; bottom:7px; height:2px; border-radius:2px; background:#ffffff10; overflow:hidden; opacity:0; transition:opacity .4s; }
  .tile.on .bar { opacity:1; }
  .tile .bar i { display:block; height:100%; width:var(--b,0%); background:rgba(var(--cr),.85); transition:width .4s var(--ease); }

  /* ---------- room map ---------- */
  .vt { display:flex; padding:3px; gap:2px; background:var(--s1); border:1px solid var(--line); border-radius:11px; }
  .vt button { width:34px; height:28px; border-radius:8px; display:grid; place-items:center; color:var(--dim2); }
  .vt button.on { background:var(--s3); color:var(--text); }
  .vt svg { width:17px; height:17px; }
  .chip.arr.on { background:#e8e9ee; color:#111; border-color:#e8e9ee; }
  .map { position:relative; border-radius:22px; border:1px solid var(--line); overflow:hidden; aspect-ratio:2.5; min-height:280px;
    background:radial-gradient(#ffffff0c 1px, transparent 1.2px) 0 0/24px 24px, linear-gradient(180deg,#12141a,#0e1015); }
  .map.edit { border-color:#ffffff40; }
  .map.edit::after { content:"Drag each light to where it is in the room"; position:absolute; left:50%; bottom:12px; transform:translateX(-50%);
    font-size:12.5px; color:var(--dim); background:#0b0c10cc; padding:5px 12px; border-radius:20px; pointer-events:none; white-space:nowrap; }
  .pool { position:absolute; border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; mix-blend-mode:screen; opacity:0;
    background:radial-gradient(closest-side, rgba(var(--cr),.8), rgba(var(--cr),.3) 40%, rgba(var(--cr),.08) 70%, transparent); transition:opacity .9s, width .6s var(--ease), height .6s var(--ease), background 1s; }
  .pool.on { opacity:1; }
  .node { --c:#888; --cr:136,136,136; position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:7px;
    cursor:pointer; user-select:none; -webkit-user-select:none; touch-action:manipulation; transition:left .5s var(--ease), top .5s var(--ease); z-index:2; }
  .node.dragging { transition:none; z-index:3; }
  .map.edit .node { cursor:grab; touch-action:none; }
  .node .bulb { width:44px; height:44px; box-shadow:0 0 0 1px #ffffff14; }
  .node.on .bulb { background:var(--c); box-shadow:0 0 26px rgba(var(--cr),.7); }
  .node.on .bulb svg { color:#0008; }
  .node.anim .bulb { background:var(--fx); background-size:200% 200%; animation:drift 6s linear infinite; }
  .node.offline { opacity:.35; }
  .node > span:last-child { font-size:12px; font-weight:600; color:#e6e8ee; background:#0b0c10b3; padding:2px 9px; border-radius:20px; white-space:nowrap; max-width:150px; overflow:hidden; text-overflow:ellipsis; }
  .node:active .bulb { transform:scale(.94); }

  /* ---------- screen zone picker ---------- */
  .scr { display:grid; grid-template-columns:280px 1fr; gap:22px; align-items:start; }
  .scrl { display:flex; flex-direction:column; gap:4px; max-height:520px; overflow:auto; }
  .scrl button { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:11px; text-align:left; font-size:13.5px; font-weight:600; border:1px solid transparent; }
  .scrl button:hover { background:var(--s2); }
  .scrl button.on { background:var(--s2); border-color:var(--line2); }
  .scrl button i { width:12px; height:12px; border-radius:50%; flex:none; }
  .scrl button small { margin-left:auto; color:var(--dim2); font-weight:500; font-size:12px; white-space:nowrap; }
  .scrl h4 { margin:10px 10px 4px; font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--dim2); }
  .scrl h4:first-child { margin-top:0; }
  .mon { position:relative; aspect-ratio:16/9; border-radius:14px; border:7px solid #23262f; background:linear-gradient(135deg,#191c25,#101218); box-shadow:0 20px 50px #0008; }
  .stand { width:22%; height:16px; margin:0 auto; background:linear-gradient(#23262f,#1a1c23); clip-path:polygon(30% 0,70% 0,100% 100%,0 100%); }
  .hs { position:absolute; display:flex; flex-wrap:wrap; align-content:center; justify-content:center; gap:4px; padding:4px; border:1px dashed #ffffff1c;
    border-radius:8px; cursor:pointer; transition:background .2s, border-color .2s; }
  .hs:hover { background:#ffffff0d; border-color:#ffffff40; }
  .hs.sel { background:rgba(var(--sr),.18); border:1.5px solid rgba(var(--sr),.9); }
  .hs b { width:100%; text-align:center; font-size:10.5px; font-weight:600; color:var(--dim2); text-transform:uppercase; letter-spacing:.5px; }
  .hs.sel b { color:#fff; }
  .pill { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; background:#0b0c10c0; padding:2px 8px 2px 4px; border-radius:20px; white-space:nowrap; }
  .pill i { width:9px; height:9px; border-radius:50%; }
  .scrx { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .scrx .hs { position:relative; flex:1; min-width:180px; min-height:56px; }

  /* ---------- controls ---------- */
  .switch { position:relative; width:50px; height:30px; border-radius:30px; background:var(--s3); flex:none; transition:background .25s; }
  .switch::after { content:""; position:absolute; left:3px; top:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:transform .25s var(--ease); box-shadow:0 1px 3px #0006; }
  .switch.on { background:var(--sw,#e8a54b); }
  .switch.on::after { transform:translateX(20px); }
  .slider { position:relative; height:52px; border-radius:14px; background:var(--s3); overflow:hidden; cursor:pointer; touch-action:none; user-select:none; }
  .slider .fill { position:absolute; inset:0 auto 0 0; width:var(--v,50%); background:var(--sc,#e8e9ee); opacity:.9; transition:width .25s var(--ease); }
  .slider.drag .fill { transition:none; }
  .slider .lbl { position:absolute; left:14px; top:50%; transform:translateY(-50%); font-weight:650; font-size:14px; color:#111; mix-blend-mode:normal; pointer-events:none;
    text-shadow:0 0 6px #fff8; }
  .slider .lbl.light { color:var(--text); text-shadow:none; }

  /* ---------- sheet ---------- */
  .scrim { position:fixed; inset:0; background:#000a; opacity:0; pointer-events:none; transition:opacity .3s; z-index:20; }
  .scrim.on { opacity:1; pointer-events:auto; }
  .sheet { position:fixed; z-index:21; top:0; right:0; bottom:0; width:420px; max-width:100%; background:#121419; border-left:1px solid var(--line);
    transform:translateX(102%); transition:transform .38s var(--ease); display:flex; flex-direction:column; }
  .sheet.on { transform:none; }
  .grab { display:none; }
  .shead { display:flex; align-items:center; gap:12px; padding:20px 20px 14px; }
  .shead .bulb { width:42px; height:42px; }
  .shead h3 { margin:0; font-size:19px; font-weight:700; }
  .shead small { color:var(--dim); font-size:13px; }
  .shead > div { flex:1; min-width:0; }
  .x { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; color:var(--dim); }
  .x:hover { background:var(--s2); color:var(--text); }
  .x svg { width:18px; height:18px; }
  .sbody { flex:1; overflow:auto; padding:4px 20px 30px; overscroll-behavior:contain; }
  .seg { display:flex; gap:4px; padding:4px; background:var(--s1); border:1px solid var(--line); border-radius:13px; margin:18px 0 16px; }
  .seg button { flex:1; padding:8px 4px; border-radius:9px; font-size:13px; font-weight:600; color:var(--dim); transition:background .15s,color .15s; }
  .seg button.on { background:var(--s3); color:var(--text); }
  .wheel { position:relative; width:min(300px,100%); aspect-ratio:1; margin:6px auto 4px; border-radius:50%; touch-action:none; cursor:crosshair;
    background:radial-gradient(circle closest-side,#fff,#fff0), conic-gradient(red,#ff0,lime,cyan,blue,#f0f,red); box-shadow:0 0 0 1px #ffffff14, 0 10px 40px #0007; }
  .thumb { position:absolute; width:26px; height:26px; margin:-13px 0 0 -13px; border-radius:50%; border:3px solid #fff; box-shadow:0 1px 6px #000a; pointer-events:none;
    transition:left .2s var(--ease), top .2s var(--ease); }
  .drag .thumb { transition:none; }
  .ktrack { position:relative; height:52px; border-radius:14px; touch-action:none; cursor:pointer; margin:4px 0 4px; }
  .ktrack .thumb { top:50%; }
  .ktrack.off .thumb { display:none; }
  .kl { display:flex; justify-content:space-between; color:var(--dim2); font-size:11.5px; margin-top:6px; }
  .dots { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
  .dot { width:38px; height:38px; border-radius:50%; border:2px solid #0006; transition:transform .15s var(--ease); position:relative; }
  .dot:hover { transform:scale(1.1); }
  .dot.on::after { content:""; position:absolute; inset:-6px; border-radius:50%; border:2px solid #fffc; }
  .wl { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; margin-top:18px; }
  .wl button { padding:10px; border-radius:12px; background:var(--s1); border:1px solid var(--line); text-align:left; font-size:13px; font-weight:600; display:flex; gap:9px; align-items:center; }
  .wl button i { width:16px; height:16px; border-radius:50%; flex:none; }
  .wl button.on { border-color:#ffffff60; background:var(--s2); }
  .fxg { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
  .fx { position:relative; padding:12px; border-radius:14px; background:var(--s1); border:1px solid var(--line); text-align:left; overflow:hidden; min-height:74px;
    display:flex; flex-direction:column; justify-content:flex-end; font-weight:600; font-size:13.5px; transition:transform .15s var(--ease), border-color .2s; }
  .fx:active { transform:scale(.96); }
  .fx i { position:absolute; inset:0 0 auto 0; height:34px; background:var(--g); background-size:300% 100%; animation:drift 9s linear infinite; opacity:.85;
    mask-image:linear-gradient(#000,#0000); -webkit-mask-image:linear-gradient(#000,#0000); }
  .fx.on { border-color:#ffffffa0; }
  .fx.on::before { content:"Running"; position:absolute; top:8px; right:9px; font-size:10.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:#fff;
    background:#0008; padding:2px 7px; border-radius:10px; z-index:1; }
  .stopfx { width:100%; margin-top:12px; padding:12px; border-radius:13px; background:var(--s2); border:1px solid var(--line2); font-weight:600; }
  .note { color:var(--dim); font-size:13px; margin:14px 2px 0; }
  .search { width:100%; padding:11px 14px; border-radius:12px; background:var(--s1); border:1px solid var(--line); outline:none; }
  .search:focus { border-color:var(--line2); }
  .scl { display:flex; flex-direction:column; gap:2px; margin-top:10px; }
  .scl button { text-align:left; padding:10px 12px; border-radius:10px; font-size:14px; }
  .scl button:hover { background:var(--s1); }
  .scl button.on { background:var(--s2); font-weight:650; }
  .sfoot { padding:12px 20px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); display:flex; justify-content:space-between; color:var(--dim); font-size:13px; }
  .sfoot a { color:var(--dim); text-decoration:none; }
  .sfoot a:hover { color:var(--text); }

  /* ---------- schedule / settings ---------- */
  h1.page { font-size:30px; margin:0 0 4px; font-weight:700; letter-spacing:-.3px; }
  .sub { color:var(--dim); margin:0 0 24px; }
  .card { background:var(--s1); border:1px solid var(--line); border-radius:var(--r); padding:20px; margin-bottom:18px; }
  .card h2 { margin:0; font-size:16px; font-weight:700; }
  .ch { display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .ch .sp { flex:1; }
  .ch small { color:var(--dim); font-size:13px; }
  .week { display:grid; grid-template-columns:38px 1fr; gap:7px 10px; align-items:center; }
  .week > b { color:var(--dim); font-size:12px; font-weight:600; }
  .week > b.today { color:var(--text); }
  .week .tl { height:24px; }
  .week .tl span { font-size:11px; padding:0 6px; }
  .entry { display:flex; align-items:center; gap:8px; padding:10px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
  .entry:first-child { border-top:0; }
  .days { display:flex; gap:3px; }
  .days button { width:34px; padding:6px 0; border-radius:8px; font-size:12px; font-weight:600; color:var(--dim); background:var(--s2); }
  .days button.on { background:#2f4a7a; color:#fff; }
  .in { background:var(--s2); border:1px solid var(--line2); border-radius:10px; padding:7px 10px; font-size:14px; outline:none; min-width:0; }
  .in:focus { border-color:#4a5063; }
  .btn { padding:9px 16px; border-radius:11px; background:var(--s2); border:1px solid var(--line2); font-weight:600; font-size:14px; transition:background .15s; white-space:nowrap; }
  .btn:hover { background:var(--s3); }
  .btn.primary { background:#e8e9ee; color:#111; border-color:#e8e9ee; }
  .btn.primary:disabled { opacity:.35; cursor:default; }
  .btn.ghost { background:none; border-color:transparent; color:var(--dim); }
  .btn.ghost:hover { color:var(--red); background:#ff6b6b14; }
  .mrow { display:flex; align-items:center; gap:10px; padding:11px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
  .mrow:first-child { border-top:0; }
  .mrow .sw { width:30px; height:30px; border-radius:9px; background:var(--mg); flex:none; }
  .mrow .nm { font-weight:600; min-width:140px; flex:1; }
  .msg { color:var(--ok); font-size:12.5px; }
  .lrow { display:grid; grid-template-columns:38px minmax(160px,1.4fr) minmax(120px,1fr) auto; gap:12px; align-items:center; padding:12px 0; border-top:1px solid var(--line); }
  .lrow:first-of-type { border-top:0; }
  .lrow .bulb { width:34px; height:34px; }

<script>
"use strict";
// ======================================================================= helpers
const $ = (s, el = document) => el.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const post = (url, body) => fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body || {}) });
const buzz = () => navigator.vibrate?.(8);
const ICON_BULB = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>`;
const ICON_GRID = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>`;
const ICON_MAP = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.6" fill="currentColor"/><circle cx="15.5" cy="9" r="1.6" fill="currentColor"/><circle cx="12" cy="15" r="1.6" fill="currentColor"/></svg>`;
const ICON_MORE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>`;

function k2rgb(k) {
  k /= 100; let r, g, b;
  if (k <= 66) { r = 255; g = 99.47 * Math.log(k) - 161.12; b = k <= 19 ? 0 : 138.52 * Math.log(k - 10) - 305.04; }
  else { r = 329.7 * Math.pow(k - 60, -0.1332); g = 288.12 * Math.pow(k - 60, -0.0755); b = 255; }
  return [r, g, b].map(v => clamp(Math.round(v), 0, 255));
}
const hex = ([r, g, b]) => "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join("");
const unhex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function hsv2rgb(h, s, v) {
  const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return [f(5), f(3), f(1)].map(x => Math.round(x * 255));
}
function rgb2hsv([r, g, b]) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [(h * 60 + 360) % 360, mx ? d / mx : 0, mx];
}
function hueName(rgb) {
  const [h, s] = rgb2hsv(rgb);
  if (s < 0.18) return "White";
  return h < 12 ? "Red" : h < 35 ? "Orange" : h < 50 ? "Amber" : h < 68 ? "Yellow" : h < 95 ? "Lime" : h < 150 ? "Green"
    : h < 175 ? "Teal" : h < 200 ? "Cyan" : h < 245 ? "Blue" : h < 265 ? "Indigo" : h < 295 ? "Purple" : h < 335 ? "Pink" : "Red";
}
const kName = k => k < 3000 ? "Warm white" : k < 4500 ? "Neutral white" : k < 5800 ? "Daylight" : "Cool white";

// effect looks (for chips, tiles and mode colors)
const FXP = {
  rainbow:["#ff4545","#ffcf3b","#3bff6e","#3bc8ff","#a63bff","#ff4545"], candy:["#ff2a4d","#fff0f0","#ff2a4d"],
  twinkle:["#14256e","#e8f0ff","#3050ff","#14256e"], fire:["#ff3000","#ff8a00","#ffc640","#ff3000"], aurora:["#00ff9c","#00a0ff","#8a2be2","#00ff9c"],
  ocean:["#0030ff","#00c8ff","#00ffd0","#0030ff"], breathe:["#ffb070","#4a2a18","#ffb070"], police:["#ff1a1a","#1a3cff","#ff1a1a"],
  screen:["#7f5af0","#2cb67d","#ff8906","#7f5af0"],
};
const fxGrad = id => `linear-gradient(90deg,${(FXP[id] || ["#888", "#444", "#888"]).join(",")})`;
const fxName = id => id === "screen" ? "Following screen" : (EFFECTS.find(e => e.id === id) || {}).name || id;

// ======================================================================= state
let S = { devices:[], modes:null };
let EFFECTS = [], ZONES = [], INFO = {};
const pend = {};             // id -> { until, status, top }: what we just asked for, shown until the server agrees
let view = "home";
const PHONE = matchMedia("(max-width: 820px)");
PHONE.addEventListener("change", () => render());

Promise.all([
  fetch("/api/effects").then(r => r.json()).then(e => { EFFECTS = e; }),
  fetch("/api/zones").then(r => r.json()).then(z => { ZONES = z; }),
  fetch("/api/info").then(r => r.json()).then(i => { INFO = i; }),
]).catch(() => {}).finally(() => render());

const devById = id => S.devices.find(d => d.id === id);
function roomsOf() {
  const m = new Map();
  for (const d of S.devices) { const r = d.room || ""; if (!m.has(r)) m.set(r, []); m.get(r).push(d); }
  return [...m.entries()].sort((a, b) => (a[0] === "") - (b[0] === "") || b[1].length - a[1].length || a[0].localeCompare(b[0]));
}
const roomLabel = r => r || "Other";
function idsOf(target) {
  if (target === "all") return S.devices.filter(d => d.online).map(d => d.id);
  if (target.startsWith("room:")) return S.devices.filter(d => d.online && (d.room || "") === target.slice(5)).map(d => d.id);
  return [target];
}
function applyPending() {
  const now = Date.now();
  for (const d of S.devices) {
    const p = pend[d.id];
    if (!p) continue;
    if (p.until < now) { delete pend[d.id]; continue; }
    d.status = { ...(d.status || {}), ...p.status };
    Object.assign(d, p.top);
  }
}
function optimistic(target, status = {}, top = {}) {
  const until = Date.now() + 2500;
  for (const id of idsOf(target)) {
    const old = pend[id] && pend[id].until > Date.now() ? pend[id] : { status:{}, top:{} };
    pend[id] = { until, status:{ ...old.status, ...status }, top:{ ...old.top, ...top } };
  }
  applyPending();
  render();
}
async function act(target, body) {
  try {
    const r = await post(`/api/devices/${encodeURIComponent(target)}`, body);
    if (!r.ok) toast("That light didn't take the command");
  } catch { toast("Can't reach the lights server"); }
}
function throttle(key, fn, ms = 130) {
  const t = throttle[key] ||= { last:0, pending:null };
  clearTimeout(t.pending);
  t.pending = setTimeout(() => { t.last = Date.now(); fn(); }, Math.max(0, t.last + ms - Date.now()));
}
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600); }

// what a light looks like right now
function glow(d) {
  const st = d.status || {};
  if (st.colorTemInKelvin > 0) return k2rgb(st.colorTemInKelvin);
  if (st.color && st.color.r + st.color.g + st.color.b > 40) return [st.color.r, st.color.g, st.color.b];
  return d.effect ? unhex((FXP[d.effect] || ["#ffb070"])[1] || "#ffb070") : d.scene ? [255, 154, 60] : [200, 200, 200];
}
const isOn = d => !!(d.online && (d.status?.onOff || d.fading?.tag === "off"));
const mins = sec => sec < 60 ? "under a minute" : `${Math.ceil(sec / 60)} min`;
const FADES = [[0, "Quick"], [60, "1 min fade"], [300, "5 min fade"], [600, "10 min fade"], [1200, "20 min fade"], [1800, "30 min fade"], [3600, "1 hour fade"]];
const fadeOptions = cur => FADES.map(([v, l]) => `<option value="${v}"${v === (cur || 0) ? " selected" : ""}>${l}</option>`).join("")
  + (cur && !FADES.some(([v]) => v === cur) ? `<option value="${cur}" selected>${mins(cur)} fade</option>` : "");
function stateText(d) {
  if (!d.online) return "Offline";
  const st = d.status || {};
  if (d.fading) return `${d.fading.tag === "off" ? "Fading out" : "Fading in"} · ${st.brightness ?? 0}% · ${mins(d.fading.left)}`;
  if (!st.onOff) return "Off";
  const b = `${st.brightness ?? 100}%`;
  if (d.effect) return `${fxName(d.effect)} · ${b}`;
  if (d.scene) return `${d.scene} · ${b}`;
  if (st.colorTemInKelvin > 0) return `${kName(st.colorTemInKelvin)} · ${b}`;
  return `${hueName(glow(d))} · ${b}`;
}

// ======================================================================= live connection
let es, lastMsg = 0;
function setConn(cls, text) { const c = $("#conn"); c.className = "conn " + cls; c.lastElementChild.textContent = text; }
function connect() {
  try { es?.close(); } catch {}
  es = new EventSource("/api/events");
  es.onopen = () => { setConn("live", "Live"); };
  es.onmessage = e => { lastMsg = Date.now(); setConn("live", "Live"); receive(JSON.parse(e.data)); };
  es.addEventListener("ping", () => { lastMsg = Date.now(); });
  es.onerror = () => setConn("down", "Reconnecting…");
}
function receive(data) {
  S = data;
  applyPending();
  render();
}
setInterval(() => { if (!document.hidden && Date.now() - lastMsg > 40000) connect(); }, 5000);   // dead connection watchdog
document.addEventListener("visibilitychange", () => { if (!document.hidden && (!es || es.readyState === 2 || Date.now() - lastMsg > 20000)) connect(); });
connect();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

// ======================================================================= routing
function go() {
  view = (location.hash.slice(1) || "home").split("/")[0];
  if (!["home", "schedule", "settings"].includes(view)) view = "home";
  document.querySelectorAll("[data-v]").forEach(a => a.classList.toggle("on", a.dataset.v === view));
  $("#main").innerHTML = "";
  built = {};
  render();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", go);
let built = {};

function render() {
  renderSide();
  ambient();
  if (!S.modes) { if (!$("#main").children.length) $("#main").innerHTML = `<div class="empty">Connecting to the lights…</div>`; return; }
  $(".empty", $("#main"))?.remove();
  if (view === "home") renderHome();
  else if (view === "schedule") renderSchedule();
  else renderSettings();
  if (sheetTarget) renderSheet();
}

function renderSide() {
  const html = roomsOf().map(([r, list]) => `<a class="nav sub" href="#home" data-room="${esc(r)}">${esc(roomLabel(r))}<b>${list.filter(isOn).length}/${list.length}</b></a>`).join("");
  const box = $("#sideRooms");
  if (box._h !== html) {
    box._h = html; box.innerHTML = html;
    box.querySelectorAll("a").forEach(a => a.onclick = e => {
      e.preventDefault();
      if (view !== "home") { location.hash = "home"; setTimeout(() => scrollRoom(a.dataset.room), 60); } else scrollRoom(a.dataset.room);
    });
  }
}
const scrollRoom = r => document.getElementById("room-" + r)?.scrollIntoView({ behavior:"smooth", block:"start" });

function ambient() {
  const on = S.devices.filter(isOn);
  if (!on.length) { document.body.style.setProperty("--amb", "transparent"); return; }
  const c = on.map(glow).reduce((a, b) => a.map((v, i) => v + b[i])).map(v => Math.round(v / on.length));
  document.body.style.setProperty("--amb", `rgb(${c})`);
}

// ======================================================================= modes & schedule maths
const modeById = id => S.modes.modes.find(m => m.id === id);
const modeName = id => modeById(id)?.name || id || "—";
function modeColors(m) {
  const out = [];
  for (const s of m?.steps || []) {
    const b = s.body || {};
    if (b.action === "kelvin") out.push(hex(k2rgb(b.value)));
    else if (b.action === "color") out.push(hex([b.r, b.g, b.b]));
    else if (b.action === "effect") out.push(...(FXP[b.effect] || []).slice(0, 3));
    else if (b.action === "scene") out.push("#ff9a3c");
  }
  return [...new Set(out)].slice(0, 4);
}
function modeGrad(m) {
  const c = modeColors(m);
  return !c.length ? "linear-gradient(90deg,#2a2d36,#1d2028)" : c.length === 1 ? `linear-gradient(90deg,${c[0]},${c[0]}cc)` : `linear-gradient(90deg,${c.join(",")})`;
}
const modeSolid = m => modeColors(m)[0] || "#2a2d36";
const when = iso => {
  const d = new Date(iso), t = d.toLocaleTimeString([], { hour:"numeric", minute:"2-digit" });
  const tmr = new Date(); tmr.setDate(tmr.getDate() + 1);
  return d.toDateString() === new Date().toDateString() ? t : d.toDateString() === tmr.toDateString() ? `${t} tomorrow` : `${d.toLocaleDateString([], { weekday:"short" })} ${t}`;
};
function weekEvents(entries) {
  const ev = [];
  for (const e of entries || []) {
    const [h, m] = String(e.time || "0:0").split(":").map(Number);
    for (const d of e.days || []) ev.push({ t:d * 1440 + h * 60 + m, mode:e.mode });
  }
  return ev.sort((a, b) => a.t - b.t);
}
function daySegments(entries, day) {
  const ev = weekEvents(entries);
  if (!ev.length) return [];
  const start = day * 1440;
  let cur = ev[ev.length - 1];
  for (const e of ev) if (e.t <= start) cur = e;
  const segs = []; let t = 0, mode = cur.mode;
  for (const e of ev) if (e.t > start && e.t < start + 1440) { segs.push({ from:t, to:e.t - start, mode }); t = e.t - start; mode = e.mode; }
  segs.push({ from:t, to:1440, mode });
  return segs.filter(s => s.to > s.from);
}
function timeline(entries, day, now) {
  const segs = daySegments(entries, day);
  return `<div class="tl">${segs.map(s => {
    const w = (s.to - s.from) / 14.4, m = modeById(s.mode);
    const [r, g, b] = unhex(modeSolid(m)), light = (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.62;
    return `<span style="width:${w}%;background:${modeGrad(m)}${light ? ";color:#1a1408;text-shadow:none" : ""}" title="${esc(modeName(s.mode))}">${w > (PHONE.matches ? 16 : 9) ? esc(modeName(s.mode)) : ""}</span>`;
  }).join("")}${now != null ? `<i class="now" style="left:${now / 14.4}%"></i>` : ""}</div>`;
}
const todayIdx = () => (new Date().getDay() + 6) % 7;
const minutesNow = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };

// ======================================================================= home
function renderHome() {
  const main = $("#main");
  if (!built.home) {
    built.home = true;
    main.innerHTML = `<div class="view">
      <div class="hello" id="hello"></div>
      <div class="hero"><h1 id="heroMode"></h1><span class="st" id="heroSt"></span><button class="chip amber" id="resume" hidden>Back to schedule</button></div>
      <div class="modes" id="modes"></div>
      <div class="day" id="day"></div>
      <div id="rooms"></div></div>`;
    $("#resume").onclick = () => { buzz(); fetch("/api/mode/resume"); };
  }
  const M = S.modes;
  const h = new Date().getHours();
  $("#hello").textContent = h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : h < 22 ? "Good evening" : "Good night";

      <span class="mg"></span><b>${esc(m.name)}</b><small>${m.id === M.active ? "On now" : m.scope?.startsWith("room:") ? esc(m.scope.slice(5) || "Other") : "Everywhere"}</small></button>`).join("");
    box.querySelectorAll(".mode").forEach(b => b.onclick = () => {
      buzz();
      S.modes.active = b.dataset.id; box._k = null; renderHome();

  // today's schedule

  const day = $("#day");
  if (day._k !== dk) {

    day.innerHTML = M.schedule.enabled && M.schedule.entries.length
      ? timeline(M.schedule.entries, todayIdx(), minutesNow()) + `<div class="ticks"><span>12a</span><span>6a</span><span>12p</span><span>6p</span><span>12a</span></div>` : "";

}

function makeRoom(r) {

}

function setArrange(sec, on) {
  $(".map", sec).classList.toggle("edit", on);
  $(".arr", sec).classList.toggle("on", on);
  $(".arr", sec).textContent = on ? "Done" : "Arrange";
}

function updateRoom(sec, r, list) {
  const on = list.filter(isOn);
  $(".rm", sec).textContent = on.length ? `${on.length} of ${list.length} on` : "All off";
  $(".rpw", sec).classList.toggle("on", on.length > 0);
  const avg = on.length ? Math.round(on.reduce((a, d) => a + (d.status.brightness ?? 100), 0) / on.length) : 0;
  sec._sl.set(avg, on.length ? `${avg}%` : "Off");
  const rc = on.length ? on.map(glow).reduce((a, b) => a.map((v, i) => v + b[i])).map(v => v / on.length) : null;
  $(".rsl", sec).style.setProperty("--sc", rc ? `rgb(${rc.map(v => Math.round(v * 0.55 + 232 * 0.45))})` : "#3a3e4a");
  const mode = PHONE.matches ? "tiles" : localStorage.getItem("lights.view." + r) || "tiles";
  sec.querySelectorAll(".vt button").forEach(b => b.classList.toggle("on", b.dataset.m === mode));
  $(".arr", sec).hidden = mode !== "map";
  $(".tiles", sec).hidden = mode === "map";
  $(".map", sec).hidden = mode !== "map";
  if (mode === "map") updateMap($(".map", sec), list);
  const tiles = $(".tiles", sec);
  list.forEach((d, j) => {
    let t = tiles.querySelector(`[data-id="${CSS.escape(d.id)}"]`);
    if (!t) t = makeTile(d.id);
    if (tiles.children[j] !== t) tiles.insertBefore(t, tiles.children[j] || null);
    updateTile(t, d);
  });
  [...tiles.children].forEach(t => { if (!list.some(d => d.id === t.dataset.id)) t.remove(); });
}

function toggleLight(id) {
  const d = devById(id);
  if (!d?.online) return toast(`${d?.name || "That light"} is offline`);
  buzz();
  const on = !isOn(d);
  optimistic(id, { onOff:on ? 1 : 0 });
  act(id, { action:"power", on, fade:0.8 });
}
function lightLook(el, d) {
  const c = glow(d), on = isOn(d);
  el.classList.toggle("on", on);
  el.classList.toggle("offline", !d.online);
  el.classList.toggle("anim", on && !!(d.effect || d.scene));
  el.style.setProperty("--c", `rgb(${c})`);
  el.style.setProperty("--cr", c.join(","));
  el.style.setProperty("--fx", d.effect ? fxGrad(d.effect) : "linear-gradient(90deg,#ff9a3c,#ff5e62,#ffcf6b,#ff9a3c)");
}
function defaultSpots(list) {
  const free = list.filter(d => !d.pos), spots = {};
  free.forEach((d, i) => { spots[d.id] = [(i + 1) / (free.length + 1), list.length === free.length ? 0.5 : 0.82]; });
  return spots;
}
function updateMap(map, list) {
  const spots = defaultSpots(list);
  for (const d of list) {
    let n = map.querySelector(`.node[data-id="${CSS.escape(d.id)}"]`), pool;
    if (!n) {
      pool = document.createElement("div"); pool.className = "pool"; pool.dataset.id = d.id; map.appendChild(pool);
      n = makeNode(d.id, map); map.appendChild(n);
    } else pool = map.querySelector(`.pool[data-id="${CSS.escape(d.id)}"]`);
    lightLook(n, d); lightLook(pool, d);
    n.lastElementChild.textContent = d.name || d.id;
    n.title = stateText(d);
    const size = 140 + (d.status?.brightness ?? 0) * 2.4;
    pool.style.width = pool.style.height = `${size}px`;
    if (!n.classList.contains("dragging")) {
      const [x, y] = d.pos || spots[d.id];
      n.style.left = pool.style.left = `${x * 100}%`;
      n.style.top = pool.style.top = `${y * 100}%`;

}
function makeNode(id, map) {
  const n = document.createElement("div");
  n.className = "node"; n.dataset.id = id; n.tabIndex = 0; n.setAttribute("role", "button");
  n.innerHTML = `<span class="bulb">${ICON_BULB}</span><span></span>`;
  let press, long = false, drag = null;
  n.addEventListener("pointerdown", e => {
    long = false;
    if (map.classList.contains("edit")) {
      n.setPointerCapture(e.pointerId); n.classList.add("dragging");
      drag = { pool:map.querySelector(`.pool[data-id="${CSS.escape(id)}"]`), xy:null };
      return;
    }
    press = setTimeout(() => { long = true; buzz(); openSheet(id); }, 480);
  });
  n.addEventListener("pointermove", ev => {
    if (!drag) return;
    const r = map.getBoundingClientRect();
    const x = clamp((ev.clientX - r.left) / r.width, 0.04, 0.96), y = clamp((ev.clientY - r.top) / r.height, 0.08, 0.9);
    n.style.left = drag.pool.style.left = `${x * 100}%`; n.style.top = drag.pool.style.top = `${y * 100}%`; drag.xy = [x, y];
  });
  const end = () => {
    clearTimeout(press);
    if (!drag) return;
    const xy = drag.xy; drag = null; n.classList.remove("dragging");
    if (xy) { optimistic(id, {}, { pos:xy }); act(id, { action:"position", x:xy[0], y:xy[1] }); }
  };
  n.addEventListener("pointerup", end); n.addEventListener("pointercancel", end);
  n.addEventListener("pointerleave", () => { if (!drag) clearTimeout(press); });
  n.onclick = () => { if (map.classList.contains("edit") || long) return; toggleLight(id); };
  n.oncontextmenu = e => { e.preventDefault(); clearTimeout(press); if (!long) openSheet(id); };
  n.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleLight(id); } };
  return n;
}

function makeTile(id) {
  const t = document.createElement("div");
  t.className = "tile"; t.dataset.id = id; t.tabIndex = 0; t.setAttribute("role", "button");
  t.innerHTML = `<span class="bulb">${ICON_BULB}</span><div class="tt"><b></b><small></small></div><button class="more" aria-label="Controls">${ICON_MORE}</button><span class="bar"><i></i></span>`;
  let press, long = false;
  const toggle = () => toggleLight(id);
  t.onpointerdown = e => { if (e.target.closest(".more")) return; long = false; press = setTimeout(() => { long = true; buzz(); openSheet(id); }, 480); };
  t.onpointerup = t.onpointerleave = t.onpointercancel = () => clearTimeout(press);
  t.onclick = e => { if (e.target.closest(".more")) return openSheet(id); if (long) return; toggle(); };
  t.oncontextmenu = e => { e.preventDefault(); clearTimeout(press); if (!long) openSheet(id); };
  t.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
  return t;
}

function updateTile(t, d) {
  const c = glow(d), on = isOn(d);
  t.classList.toggle("on", on);
  t.classList.toggle("offline", !d.online);
  t.classList.toggle("bad", !!d.unconfirmed);
  t.classList.toggle("anim", on && !!(d.effect || d.scene));
  t.style.setProperty("--c", `rgb(${c})`);
  t.style.setProperty("--cr", c.join(","));
  t.style.setProperty("--b", `${d.status?.brightness ?? 0}%`);
  t.style.setProperty("--fx", d.effect ? fxGrad(d.effect) : "linear-gradient(90deg,#ff9a3c,#ff5e62,#ffcf6b,#ff9a3c)");
  $("b", t).textContent = d.name || d.id;
  $("small", t).textContent = d.unconfirmed ? "Not responding" : stateText(d);
}

// ======================================================================= slider / wheel widgets
function slider(el, onInput, { min = 1, max = 100 } = {}) {
  const fill = $(".fill", el), lbl = $(".lbl", el);
  let dragging = false, val = 0;
  const setv = (v, text) => { val = v; el.style.setProperty("--v", `${clamp((v - min) / (max - min), 0, 1) * 100}%`); lbl.textContent = text ?? `${v}%`; lbl.classList.toggle("light", (v - min) / (max - min) < 0.18); };
  const at = e => { const r = el.getBoundingClientRect(); return Math.round(min + clamp((e.clientX - r.left) / r.width, 0, 1) * (max - min)); };
  el.onpointerdown = e => { dragging = true; el.classList.add("drag"); el.setPointerCapture(e.pointerId); const v = at(e); setv(v); onInput(v); };
  el.onpointermove = e => { if (!dragging) return; const v = at(e); if (v !== val) { setv(v); onInput(v); } };
  el.onpointerup = el.onpointercancel = () => { dragging = false; el.classList.remove("drag"); };
  return { set:(v, text) => { if (!dragging) setv(v, text); }, get dragging() { return dragging; } };
}
function drag(el, onPoint) {
  let on = false;
  el.onpointerdown = e => { on = true; el.classList.add("drag"); el.setPointerCapture(e.pointerId); onPoint(e, true); };
  el.onpointermove = e => { if (on) onPoint(e, false); };
  el.onpointerup = el.onpointercancel = e => { if (on) { on = false; el.classList.remove("drag"); onPoint(e, false, true); } };
  return () => on;
}

// ======================================================================= controls sheet
let sheetTarget = null, sheetTab = null, sheetParts = null;
const scenesCache = {};
const PRESETS = ["#ff3b30", "#ff7a1a", "#ffb340", "#30d158", "#00d0c0", "#0a84ff", "#5e5ce6", "#bf5af2", "#ff2d92"];
const WHITES = [[2200, "Candle"], [2700, "Warm"], [3500, "Soft"], [4000, "Neutral"], [5000, "Daylight"], [6500, "Cool"]];

function sheetDevs() { return sheetTarget.startsWith("room:") || sheetTarget === "all" ? S.devices.filter(d => idsOf(sheetTarget).includes(d.id)) : [devById(sheetTarget)].filter(Boolean); }
function lead() { const ds = sheetDevs(); return ds.find(isOn) || ds[0]; }

function openSheet(target) {
  sheetTarget = target; sheetParts = null;
  const d = lead();
  sheetTab = !d ? "color" : d.effect ? "fx" : d.scene ? "scenes" : d.status?.colorTemInKelvin > 0 ? "white" : "color";
  $("#scrim").classList.add("on"); $("#sheet").classList.add("on"); $("#sheet").setAttribute("aria-hidden", "false");
  $("#sheet").style.transform = "";
  buildSheet();
  renderSheet();
}
function closeSheet() {
  sheetTarget = null;
  $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on"); $("#sheet").setAttribute("aria-hidden", "true");
}
$("#scrim").onclick = closeSheet;
$("#sClose").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheetTarget) closeSheet(); });
$("#sPower").onclick = () => {
  buzz();
  const on = !$("#sPower").classList.contains("on");
  optimistic(sheetTarget, { onOff:on ? 1 : 0 });
  act(sheetTarget, { action:"power", on, fade:0.8 });
};
// phone: drag the sheet down to close
(() => {
  const z = $("#grabzone"), sh = $("#sheet");
  let y0 = null, dy = 0;
  z.addEventListener("pointerdown", e => { if (innerWidth > 820 || e.target.closest("button")) return; y0 = e.clientY; dy = 0; sh.style.transition = "none"; z.setPointerCapture(e.pointerId); });
  z.addEventListener("pointermove", e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); sh.style.transform = `translateY(${dy}px)`; });
  const end = () => { if (y0 == null) return; y0 = null; sh.style.transition = ""; sh.style.transform = ""; if (dy > 90) closeSheet(); };
  z.addEventListener("pointerup", end); z.addEventListener("pointercancel", end);
})();

function buildSheet() {
  const isDev = !sheetTarget.startsWith("room:") && sheetTarget !== "all";
  const d = isDev ? devById(sheetTarget) : null;
  const gm = !!d?.govee_modes;
  const tabs = [["color", "Color"], ["white", "White"], ["fx", "Effects"]].concat(isDev ? [["scenes", "Scenes"]] : []);
  if (!tabs.some(t => t[0] === sheetTab)) sheetTab = "color";
  const body = $("#sBody");
  body.innerHTML = `
    <div class="slider sbr" style="--sc:#e8e9ee"><div class="fill"></div><span class="lbl"></span></div>
    <div class="seg">${tabs.map(([k, n]) => `<button data-t="${k}" class="${k === sheetTab ? "on" : ""}">${n}</button>`).join("")}</div>
    <div data-p="color"${sheetTab === "color" ? "" : " hidden"}>
      <div class="wheel"><span class="thumb"></span></div>
      <div class="dots">${PRESETS.map(c => `<button class="dot" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join("")}</div>
    </div>
    <div data-p="white"${sheetTab === "white" ? "" : " hidden"}>
      <div class="ktrack"><span class="thumb"></span></div><div class="kl"><span></span><span></span></div>
      <div class="wl">${WHITES.map(([k, n]) => `<button data-k="${k}"><i style="background:${hex(k2rgb(k))}"></i>${n}</button>`).join("")}</div>
    </div>
    <div data-p="fx"${sheetTab === "fx" ? "" : " hidden"}>
      <div class="fxg">${EFFECTS.filter(e => !gm || e.id === "screen").map(e => `<button class="fx" data-fx="${esc(e.id)}" style="--g:${fxGrad(e.id)}"><i></i>${esc(e.id === "screen" ? "Screen sync" : e.name)}</button>`).join("")}</div>
      ${gm ? `<p class="note">This light is set to use Govee's own scenes for effects; pick one in <b>Scenes</b>. Screen sync still streams.</p>` : ""}
      <button class="stopfx" hidden>Stop effect</button>
    </div>
    <div data-p="scenes"${sheetTab === "scenes" ? "" : " hidden"}>
      <input class="search" placeholder="Search Govee scenes" spellcheck="false"><div class="scl"><div class="note">Loading scenes…</div></div>
    </div>`;
  body.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    sheetTab = b.dataset.t;
    body.querySelectorAll(".seg button").forEach(x => x.classList.toggle("on", x === b));
    body.querySelectorAll("[data-p]").forEach(p => p.hidden = p.dataset.p !== sheetTab);
    if (sheetTab === "scenes") loadScenes();
  });
  const T = () => sheetTarget;
  // brightness
  const br = slider($(".sbr", body), v => { optimistic(T(), { brightness:v, onOff:1 }); throttle(T() + "b", () => act(T(), { action:"brightness", value:v })); });
  // color wheel
  const wheel = $(".wheel", body);
  const wheelDragging = drag(wheel, (e, first, last) => {
    const r = wheel.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const dx = e.clientX - cx, dy = e.clientY - cy;
    const hue = (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360, sat = clamp(Math.hypot(dx, dy) / (r.width / 2), 0, 1);
    const rgb = hsv2rgb(hue, sat, 1);
    placeWheel(rgb);
    optimistic(T(), { color:{ r:rgb[0], g:rgb[1], b:rgb[2] }, colorTemInKelvin:0, onOff:1 }, { effect:null, scene:null });
    throttle(T() + "c", () => act(T(), { action:"color", r:rgb[0], g:rgb[1], b:rgb[2], ...(first ? { fade:0.5 } : {}) }), last ? 0 : 110);
  });
  const placeWheel = rgb => {
    const [h, s] = rgb2hsv(rgb), th = $(".thumb", wheel), a = h * Math.PI / 180;
    th.style.left = `${50 + Math.sin(a) * s * 50}%`; th.style.top = `${50 - Math.cos(a) * s * 50}%`; th.style.background = `rgb(${rgb})`;
  };
  body.querySelectorAll(".dot").forEach(b => b.onclick = () => {
    buzz(); const rgb = unhex(b.dataset.c);
    optimistic(T(), { color:{ r:rgb[0], g:rgb[1], b:rgb[2] }, colorTemInKelvin:0, onOff:1 }, { effect:null, scene:null });
    act(T(), { action:"color", r:rgb[0], g:rgb[1], b:rgb[2], fade:0.7 });
  });
  // white
  const kr = d?.kelvin || [2000, 9000];
  const ktrack = $(".ktrack", body);
  const steps = 8, kAt = f => Math.round((kr[0] + f * (kr[1] - kr[0])) / 50) * 50;
  ktrack.style.background = `linear-gradient(90deg,${[...Array(steps + 1)].map((_, i) => hex(k2rgb(kAt(i / steps)))).join(",")})`;
  const kl = body.querySelectorAll(".kl span"); kl[0].textContent = `${kr[0]}K`; kl[1].textContent = `${kr[1]}K`;
  const kDragging = drag(ktrack, (e, first, last) => {
    const r = ktrack.getBoundingClientRect(), k = kAt(clamp((e.clientX - r.left) / r.width, 0, 1));
    placeK(k);
    optimistic(T(), { colorTemInKelvin:k, onOff:1 }, { effect:null, scene:null });
    throttle(T() + "k", () => act(T(), { action:"kelvin", value:k, ...(first ? { fade:0.5 } : {}) }), last ? 0 : 110);
  });
  const placeK = k => {
    ktrack.classList.toggle("off", !k);
    if (!k) return;
    const th = $(".thumb", ktrack); th.style.left = `${clamp((k - kr[0]) / (kr[1] - kr[0]), 0, 1) * 100}%`; th.style.background = hex(k2rgb(k));
  };
  body.querySelectorAll(".wl button").forEach(b => b.onclick = () => {
    buzz(); const k = clamp(+b.dataset.k, kr[0], kr[1]);
    optimistic(T(), { colorTemInKelvin:k, onOff:1 }, { effect:null, scene:null });
    act(T(), { action:"kelvin", value:k, fade:0.7 });
  });
  // effects
  body.querySelectorAll(".fx").forEach(b => b.onclick = () => {
    buzz();
    optimistic(T(), { onOff:1 }, { effect:b.dataset.fx, scene:null });
    act(T(), { action:"effect", effect:b.dataset.fx, fade:1.5 });
  });
  $(".stopfx", body).onclick = () => { buzz(); optimistic(T(), {}, { effect:null }); act(T(), { action:"stop", fade:1.5 }); };
  // scenes
  $(".search", body).oninput = () => drawScenes();
  sheetParts = { br, placeWheel, wheelDragging, placeK, kDragging, isDev };
  if (sheetTab === "scenes") loadScenes();
  $("#sFoot").innerHTML = isDev ? `<span>${esc(d?.sku || "")}${d?.via === "cloud" ? " · Cloud" : ""}</span><a href="#settings/${encodeURIComponent(sheetTarget)}">Light settings →</a>`
    : `<span>${idsOf(sheetTarget).length} lights</span><a href="#schedule">Save as a mode →</a>`;
  $("#sFoot a").onclick = () => closeSheet();
}

async function loadScenes() {
  if (!sheetParts?.isDev) return;
  const id = sheetTarget;
  if (!scenesCache[id]) {
    try { scenesCache[id] = await (await fetch(`/api/scenes/${encodeURIComponent(id)}`)).json(); } catch { scenesCache[id] = []; }
  }
  if (sheetTarget === id) drawScenes();
}
function drawScenes() {
  const box = $("#sBody .scl"); if (!box) return;
  const list = scenesCache[sheetTarget];
  if (!list) return;
  const q = $("#sBody .search").value.trim().toLowerCase();
  const cur = devById(sheetTarget)?.scene;
  const shown = list.filter(n => n.toLowerCase().includes(q));
  box.innerHTML = !list.length ? `<div class="note">No Govee scenes for this light (scenes come from the cloud API).</div>`
    : shown.map(n => `<button class="${n === cur ? "on" : ""}" data-s="${esc(n)}">${esc(n)}</button>`).join("") || `<div class="note">Nothing matches.</div>`;
  box.querySelectorAll("button").forEach(b => b.onclick = () => {
    buzz();
    optimistic(sheetTarget, { onOff:1 }, { scene:b.dataset.s, effect:null });
    act(sheetTarget, { action:"scene", name:b.dataset.s });
    drawScenes();
  });
}

function renderSheet() {
  const ds = sheetDevs(); const d = lead();
  if (!d || !sheetParts) return;
  const isDev = sheetParts.isDev;
  const on = ds.some(isOn), c = glow(d);
  $("#sTitle").textContent = isDev ? d.name : sheetTarget === "all" ? "All lights" : roomLabel(sheetTarget.slice(5));
  $("#sSub").textContent = isDev ? (d.unconfirmed ? "Not responding" : stateText(d)) : `${ds.filter(isOn).length} of ${ds.length} on`;
  const bulb = $("#sBulb");
  bulb.innerHTML = ICON_BULB;
  bulb.style.background = on ? (d.effect ? fxGrad(d.effect) : `rgb(${c})`) : "";
  bulb.style.boxShadow = on ? `0 0 24px rgba(${c},.55)` : "";
  $("#sPower").classList.toggle("on", on);
  $("#sPower").style.setProperty("--sw", on ? `rgb(${c})` : "");
  const st = d.status || {};
  const onDs = ds.filter(isOn);
  const bv = onDs.length ? Math.round(onDs.reduce((a, x) => a + (x.status.brightness ?? 100), 0) / onDs.length) : 0;
  sheetParts.br.set(bv || 1, on ? `${bv}%` : "Off");
  $("#sBody .sbr").style.setProperty("--sc", on ? `rgb(${c.map(v => Math.round(v * 0.6 + 232 * 0.4))})` : "#4a4e5a");
  if (!sheetParts.wheelDragging()) sheetParts.placeWheel(st.colorTemInKelvin > 0 || !st.color ? [255, 255, 255] : c);
  if (!sheetParts.kDragging()) sheetParts.placeK(st.colorTemInKelvin || 0);
  const plain = !d.effect && !d.scene;
  document.querySelectorAll("#sBody .dot").forEach(b => b.classList.toggle("on", plain && !(st.colorTemInKelvin > 0) && b.dataset.c === hex(c)));
  document.querySelectorAll("#sBody .wl button").forEach(b => b.classList.toggle("on", plain && +b.dataset.k === st.colorTemInKelvin));
  const fxs = new Set(ds.map(x => x.effect).filter(Boolean));
  document.querySelectorAll("#sBody .fx").forEach(b => b.classList.toggle("on", fxs.has(b.dataset.fx)));
  $("#sBody .stopfx").hidden = !fxs.size && !ds.some(x => x.scene);
  if (sheetTab === "scenes") document.querySelectorAll("#sBody .scl button").forEach(b => b.classList.toggle("on", b.dataset.s === d.scene));
}

// ======================================================================= schedule page
let draft = null, dirty = false;
function renderSchedule() {
  const M = S.modes;
  const main = $("#main");
  if (!built.schedule) {
    built.schedule = true; draft = null; dirty = false;
    main.innerHTML = `<div class="view">
      <h1 class="page">Schedule</h1><p class="sub">Modes switch on by themselves through the week. Picking a mode by hand overrides it until the next change.</p>
      <div class="card"><div class="ch"><h2>This week</h2><span class="sp"></span><small>Run the schedule</small><button class="switch" id="schedOn"></button></div><div class="week" id="week"></div></div>
      <div class="card"><div class="ch"><h2>Times</h2><span class="sp"></span><button class="btn" id="addRow">Add a time</button><button class="btn primary" id="saveSched" disabled>Save</button></div><div id="entries"></div></div>
      <div class="card"><div class="ch"><h2>Modes</h2><span class="sp"></span><small>Set the lights how you like, then save them into a mode.</small></div><div id="mrows"></div>
        <div class="mrow"><input class="in" id="newName" placeholder="New mode name" style="flex:1;min-width:160px"><select class="in" id="newScope"></select><button class="btn" id="newMode">Save current lights as new mode</button></div></div>
      <div class="card"><div class="ch"><h2>Stream Deck &amp; shortcuts</h2></div><div id="urls"></div>
        <p class="help">Use Elgato's <b>Website</b> action with "GET request in background" ticked, or any button that can open a URL.</p></div></div>`;
    $("#schedOn").onclick = () => { buzz(); const on = !$("#schedOn").classList.contains("on"); $("#schedOn").classList.toggle("on", on); post("/api/schedule", { enabled:on, entries:dirty ? draft : S.modes.schedule.entries }).then(() => { dirty = false; $("#saveSched").disabled = true; }); };
    $("#addRow").onclick = () => { draft.push({ days:[0, 1, 2, 3, 4], time:"09:00", mode:S.modes.modes[0]?.id }); markDirty(); drawEntries(); };
    $("#saveSched").onclick = () => post("/api/schedule", { enabled:$("#schedOn").classList.contains("on"), entries:draft }).then(() => { dirty = false; $("#saveSched").disabled = true; toast("Schedule saved"); });
    $("#newMode").onclick = () => {
      const name = $("#newName").value.trim();
      if (!name) return $("#newName").focus();
      post("/api/modes", { name, scope:$("#newScope").value }).then(r => r.ok ? (toast(`Saved “${name}”`), $("#newName").value = "") : toast("Couldn't save that mode"));
    };
  }
  if (!dirty) { draft = JSON.parse(JSON.stringify(M.schedule.entries)); }
  $("#schedOn").classList.toggle("on", M.schedule.enabled);
  // week
  const wk = JSON.stringify([draft, M.modes, minutesNow()]);
  if ($("#week")._k !== wk) {
    $("#week")._k = wk;
    const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], ti = todayIdx();
    $("#week").innerHTML = draft.length ? DAYS.map((n, i) => `<b class="${i === ti ? "today" : ""}">${n}</b>${timeline(draft, i, i === ti ? minutesNow() : null)}`).join("")
      : `<div style="grid-column:1/-1" class="help">No times yet: add one below.</div>`;
  }
  if (!dirty && $("#entries")._k !== JSON.stringify([draft, M.modes])) drawEntries();
  // modes list
  const mk = JSON.stringify([M.modes, roomsOf().map(r => r[0])]);
  if ($("#mrows")._k !== mk) {
    $("#mrows")._k = mk;
    $("#newScope").innerHTML = scopeOptions("room:" + (roomsOf()[0]?.[0] || ""));
    $("#mrows").innerHTML = M.modes.map(m => `<div class="mrow" data-id="${esc(m.id)}"><span class="sw" style="--mg:${modeGrad(m)}"></span><span class="nm">${esc(m.name)}</span>
      <select class="in mfd" title="How long this mode takes to fade in when you pick it (a schedule time can set its own)">${fadeOptions(m.fade)}</select>
      <select class="in scope">${scopeOptions(m.scope || "all")}</select><button class="btn cap">Save current lights</button><button class="btn ghost del">Delete</button></div>`).join("");
    $("#mrows").querySelectorAll(".mrow").forEach(row => {
      const id = row.dataset.id;
      $(".cap", row).onclick = () => post(`/api/modes/${encodeURIComponent(id)}/capture`, { scope:$(".scope", row).value }).then(() => toast(`Saved the lights into “${modeName(id)}”`));
      $(".mfd", row).onchange = ev => post(`/api/modes/${encodeURIComponent(id)}/fade`, { fade:+ev.target.value })
        .then(() => toast(+ev.target.value ? `“${modeName(id)}” now fades in over ${mins(+ev.target.value)}` : `“${modeName(id)}” switches quickly`));
      const del = $(".del", row);
      del.onclick = () => {
        if (del.dataset.armed) return post(`/api/modes/${encodeURIComponent(id)}/delete`).then(() => toast(`Deleted “${modeName(id)}”`));
        del.dataset.armed = 1; del.textContent = "Really delete?";
        setTimeout(() => { delete del.dataset.armed; del.textContent = "Delete"; }, 3000);
      };
    });
  }
  const uk = JSON.stringify(M.modes.map(m => m.id));
  if ($("#urls")._k !== uk) {
    $("#urls")._k = uk;
    const o = location.origin;
    const rows = [[`${o}/api/mode/cycle?modes=${M.modes.slice(0, 3).map(m => m.id).join(",")}`, "Cycle through modes"],
      [`${o}/api/mode/toggle/watching`, "Watching on, then back to what was on"],
      ...M.modes.map(m => [`${o}/api/mode/${m.id}`, m.name]), [`${o}/api/mode/resume`, "Back to schedule"]];
    $("#urls").innerHTML = rows.map(([u, l]) => `<div class="url"><code>${esc(u)}</code><span>${esc(l)}</span></div>`).join("");
  }
}
function markDirty() { dirty = true; $("#saveSched").disabled = false; $("#week")._k = null; renderSchedule(); }
function scopeOptions(cur) {
  const opts = [["all", "All lights"], ...roomsOf().filter(([r]) => r).map(([r]) => ["room:" + r, r])];
  return opts.map(([v, l]) => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(l)}</option>`).join("");
}
function drawEntries() {
  const box = $("#entries"), M = S.modes;
  box._k = JSON.stringify([draft, M.modes]);
  const order = draft.map((e, i) => i).sort((a, b) => draft[a].time.localeCompare(draft[b].time));
  box.innerHTML = draft.length ? "" : `<div class="help" style="margin:0">No times yet.</div>`;
  for (const idx of order) {
    const e = draft[idx];
    const row = document.createElement("div");
    row.className = "entry";
    row.innerHTML = `<input type="time" class="in" value="${esc(e.time)}"><select class="in em" style="flex:1;min-width:130px">${M.modes.map(m => `<option value="${esc(m.id)}"${m.id === e.mode ? " selected" : ""}>${esc(m.name)}</option>`).join("")}</select>
      <select class="in fd" title="How long the lights take to change into this mode">${fadeOptions(e.fade)}</select>
      <div class="days">${["M", "T", "W", "T", "F", "S", "S"].map((n, i) => `<button class="${e.days.includes(i) ? "on" : ""}" data-d="${i}">${n}</button>`).join("")}</div>
      <button class="x" aria-label="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`;
    $("input", row).onchange = ev => { e.time = ev.target.value; markDirty(); };
    $(".em", row).onchange = ev => { e.mode = ev.target.value; markDirty(); };
    $(".fd", row).onchange = ev => { const v = +ev.target.value; if (v) e.fade = v; else delete e.fade; markDirty(); };
    row.querySelectorAll(".days button").forEach(b => b.onclick = () => {
      const d = +b.dataset.d; e.days = e.days.includes(d) ? e.days.filter(x => x !== d) : [...e.days, d].sort(); b.classList.toggle("on"); markDirty();
    });
    $(".x", row).onclick = () => { draft.splice(idx, 1); markDirty(); drawEntries(); };
    box.appendChild(row);
  }
}

// ======================================================================= settings page
function renderSettings() {
  const main = $("#main");
  if (!built.settings) {
    built.settings = true;
    main.innerHTML = `<div class="view">
      <h1 class="page">Settings</h1><p class="sub" id="setSub"></p>
      <div class="card"><div class="ch"><h2>Lights</h2><span class="sp"></span><button class="btn" id="scan">Scan for lights</button></div><div id="lrows"></div>
        <p class="help"><b>Govee scenes</b> makes effects on that light use Govee's built-in animations instead of streaming. Screen sync always streams.</p></div>
      <div class="card desk"><div class="ch"><h2>Screen sync</h2><span class="sp"></span><small>Pick a light, then the part of the screen it should follow in Watching.</small></div><div id="scrPick"></div></div>
      <div class="card"><div class="ch"><h2>About</h2></div><p class="help" style="margin:0"><a href="https://github.com/purzbeats/open-lights" style="color:inherit">open-lights</a> · local control for Govee lights, no cloud needed for lights with LAN Control.</p></div></div>`;
    $("#scan").onclick = async e => {
      const b = e.target; b.textContent = "Scanning…"; b.disabled = true;
      try { await post("/api/scan"); toast("Scan done"); } catch { toast("Scan failed"); } finally { b.textContent = "Scan for lights"; b.disabled = false; }
    };
    const focus = decodeURIComponent(location.hash.split("/")[1] || "");
    if (focus) setTimeout(() => { const r = document.querySelector(`.lrow[data-id="${CSS.escape(focus)}"]`); r?.scrollIntoView({ block:"center" }); r?.classList.add("flash"); }, 50);
  }
  const lan = S.devices.filter(d => d.via !== "cloud").length;
  $("#setSub").textContent = `${S.devices.length} lights · ${lan} local · ${S.devices.length - lan} cloud · cloud API ${INFO.cloud ? "on" : "off"}`;
  $("#roomlist").innerHTML = roomsOf().filter(([r]) => r).map(([r]) => `<option value="${esc(r)}">`).join("");
  const box = $("#lrows");
  const sorted = [...S.devices].sort((a, b) => (a.room || "~").localeCompare(b.room || "~") || (a.name || "").localeCompare(b.name || ""));
  sorted.forEach((d, i) => {
    let row = box.querySelector(`.lrow[data-id="${CSS.escape(d.id)}"]`);
    if (!row) row = makeLightRow(d.id);
    if (box.children[i] !== row) box.insertBefore(row, box.children[i] || null);
    const c = glow(d), on = isOn(d);
    const b = $(".bulb", row); b.style.background = on ? `rgb(${c})` : ""; b.style.boxShadow = on ? `0 0 16px rgba(${c},.5)` : "";
    const setv = (sel, v) => { const el = $(sel, row); if (document.activeElement !== el) el.value = v; };
    setv(".nm", d.name || d.id); setv(".rm", d.room || "");
    $(".gm .switch", row).classList.toggle("on", !!d.govee_modes);
    $(".meta", row).innerHTML = `<span class="badge ${d.via === "cloud" ? "cloud" : "lan"}">${d.via === "cloud" ? "Cloud" : "Local"}</span>${esc(d.sku || "")}${d.ip ? " · " + esc(d.ip) : ""}
      · ${d.online ? (d.unconfirmed ? `<span style="color:var(--red)">not responding</span>` : "online") : "offline"}`;
  });
  [...box.children].forEach(r => { if (!S.devices.some(d => d.id === r.dataset.id)) r.remove(); });
  renderPicker();
}

// screen-zone picker: a drawing of the monitor with clickable areas
const ZSHORT = { all:"Whole screen", center:"Center", left:"Left edge", right:"Right edge", top:"Top edge", bottom:"Bottom edge",
  sides:"Wrap around", "left-half":"Left half", "right-half":"Right half" };
const ZBOX = { top:[0, 0, 100, 17], bottom:[0, 83, 100, 17], left:[0, 17, 13, 66], right:[87, 17, 13, 66],
  "left-half":[13, 17, 24, 66], "right-half":[63, 17, 24, 66], center:[37, 17, 26, 66] };
let scrSel = null;
function renderPicker() {
  const box = $("#scrPick"); if (!box) return;
  const rooms = roomsOf();
  if (!scrSel || !devById(scrSel)) scrSel = (rooms.find(([r]) => r === "Office")?.[1] || S.devices)[0]?.id;
  const sel = devById(scrSel);
  const key = JSON.stringify([scrSel, S.devices.map(d => [d.id, d.name, d.zone, glow(d), d.room])]);
  if (box._k === key) return;
  box._k = key;
  const pills = z => S.devices.filter(d => (d.zone || "all") === z).map(d => `<span class="pill"><i style="background:rgb(${glow(d)})"></i>${esc(d.name)}</span>`).join("");
  const sr = sel ? glow(sel).join(",") : "255,255,255";
  const hs = (z, style) => `<div class="hs${sel && (sel.zone || "all") === z ? " sel" : ""}" data-z="${z}" ${style}><b>${ZSHORT[z]}</b>${pills(z)}</div>`;
  box.innerHTML = `<div class="scr" style="--sr:${sr}">
    <div class="scrl">${rooms.map(([r, list]) => `<h4>${esc(roomLabel(r))}</h4>` + list.map(d => `<button class="${d.id === scrSel ? "on" : ""}" data-id="${esc(d.id)}"><i style="background:rgb(${glow(d)})"></i>${esc(d.name)}<small>${ZSHORT[d.zone || "all"]}</small></button>`).join("")).join("")}</div>
    <div><div class="mon">${Object.entries(ZBOX).map(([z, [l, t, w, h]]) => hs(z, `style="left:${l}%;top:${t}%;width:${w}%;height:${h}%"`)).join("")}</div><div class="stand"></div>
      <div class="scrx">${hs("all", "")}${hs("sides", "")}</div>
      <p class="help">Edges sample just inside the screen edge, past taskbars and window borders. Halves and the whole screen respond more slowly, which suits lights further from the monitor. Wrap around is for strips: one end climbs the left side, the other comes down the right.</p></div></div>`;
  box.querySelectorAll(".scrl button").forEach(b => b.onclick = () => { scrSel = b.dataset.id; renderPicker(); });
  box.querySelectorAll(".hs").forEach(h => h.onclick = () => {
    if (!scrSel) return;
    buzz();
    optimistic(scrSel, {}, { zone:h.dataset.z });
    act(scrSel, { action:"screen_zone", zone:h.dataset.z });
  });
}
function makeLightRow(id) {
  const row = document.createElement("div");
  row.className = "lrow"; row.dataset.id = id;
  row.innerHTML = `<span class="bulb">${ICON_BULB}</span><input class="in nm" spellcheck="false" aria-label="Name"><input class="in rm" list="roomlist" placeholder="Room" spellcheck="false" aria-label="Room">
    <label class="gm"><button class="switch" aria-label="Govee scenes"></button>Govee scenes</label><div class="meta"></div>`;
  const enter = e => { if (e.key === "Enter") e.target.blur(); };
  $(".nm", row).onchange = e => act(id, { action:"rename", name:e.target.value }); $(".nm", row).onkeydown = enter;
  $(".rm", row).onchange = e => act(id, { action:"room", room:e.target.value.trim() }); $(".rm", row).onkeydown = enter;
  $(".gm .switch", row).onclick = e => { e.preventDefault(); const sw = e.currentTarget, on = !sw.classList.contains("on"); sw.classList.toggle("on", on); act(id, { action:"govee_modes", on }); };
  return row;
}

go();
setInterval(() => { if (!document.hidden && S.modes && view !== "settings") render(); }, 30000);   // keeps the "now" marker moving
</script>
